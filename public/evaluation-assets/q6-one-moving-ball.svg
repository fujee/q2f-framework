  <rect width="640" height="240" fill="#f4f1ea"/>
  <path d="M60 180H580" stroke="#153f35" stroke-width="4"/>
  <circle cy="150" r="28" fill="#297fbd">
    <animate attributeName="cx" values="60;580;60" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
